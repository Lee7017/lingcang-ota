name: Sync iOS support statistics

on:
  schedule:
    # GitHub 的 schedule 可能漏跑；每小时错峰尝试 6 次以降低连续数小时无更新的概率。
    # 实际查询成功后，只在数据变化或距上次公开同步满 1 小时时提交 ios.json。
    # 若需要有保证的时效，必须增加 GitHub 之外的独立定时触发器。
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  # 同步逻辑或工作流更新时运行一次，便于验证；公开 JSON 提交不会触发循环。
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-support.yml'
      - 'scripts/sync-ios-support.mjs'
      - 'scripts/verify-afdian.mjs'

# 仅允许提交公开统计文件，不能用于修改官网。
permissions:
  contents: write

concurrency:
  group: ios-support-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OTA repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify API credentials and read-only order query
        if: github.event_name != 'schedule'
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
          AFDIAN_PLAN_ID: ${{ secrets.AFDIAN_PLAN_ID || 'd9aa8642e2b411f181af52540025c377' }}
        run: node scripts/verify-afdian.mjs
      - name: Query Afdian and build public-only statistics
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
          AFDIAN_PLAN_ID: ${{ secrets.AFDIAN_PLAN_ID || 'd9aa8642e2b411f181af52540025c377' }}
          AFDIAN_SUPPORT_URL: ${{ vars.AFDIAN_SUPPORT_URL || 'https://afdian.com/item/d9aa8642e2b411f181af52540025c377' }}
        run: node scripts/sync-ios-support.mjs
      - name: Commit only changed public statistics
        shell: bash
        run: |
          if git diff --quiet -- support/ios.json; then
            echo "No changes to public statistics"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- support/ios.json
          git commit -m "Update public iOS support statistics"
          git push origin HEAD:main
